name: Something got in your way
description: Trying Endeavor or its plugin, and something stopped you, confused you or took too long. Bugs welcome too.
title: "Got in my way: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Endeavor. A few lines is plenty. Leave out anything private, such as your data, file paths or server names.
  - type: textarea
    id: what
    attributes:
      label: What were you trying to do?
      placeholder: Install the plugin with my agent, open my first notebook, run a cell on a server...
    validations:
      required: true
  - type: textarea
    id: way
    attributes:
      label: What got in your way?
      description: What happened, and what you expected instead. An error message or a screenshot helps.
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How were you using it?
      options:
        - The Endeavor app on a Mac
        - The Endeavor app on Windows
        - The Endeavor app on Linux
        - The plugin in Claude Code
        - The plugin in Codex
        - The plugin in Antigravity
        - Something else
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: In the app, Settings ▸ About shows the version and build (on a Mac, Endeavor ▸ About Endeavor too). Leave empty if you don't know.
    validations:
      required: false
