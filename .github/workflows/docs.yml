# Builds the documentation site in site/ from docs/guide and publishes it with
# GitHub Pages at https://jowch.github.io/Endeavor/. Pull requests build it
# (with the link check) but don't publish; only main publishes.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/guide/**
      - site/**
      - assets/icon/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/guide/**
      - site/**
      - assets/icon/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
