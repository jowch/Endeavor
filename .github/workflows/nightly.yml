# Keeps one "nightly" prerelease holding the newest build of main that passed
# CI on macOS, Linux and Windows: Endeavor-macos-arm64.dmg (scripts/bundle.sh's
# app, with the Linux servers' helpers inside) and Endeavor-windows-x86_64-setup.exe
# (the installer windows.yml built from that same commit). Each run replaces the
# files and moves the tag, so the download links stay the same and releases
# don't pile up. A scheduled run does nothing when the nightly already holds
# that commit. On a pull request that changes the Mac packaging it only builds
# the disk image from the pull request and keeps it as an Actions artifact,
# with a screenshot of its window; nothing is published.
# ponytail: unsigned. The Mac app is ad-hoc signed (Gatekeeper makes the user
# allow it in System Settings) and the installer isn't signed (SmartScreen
# warns). Apple Silicon only. The Windows build has no server helpers
# (windows.yml).
name: Nightly

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - assets/dmg/**
      - scripts/bundle.sh

concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The newest main commit whose Windows run (with its installer) and CI run
  # both passed; on a pull request, its head.
  pick:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      windows_run: ${{ steps.pick.outputs.windows_run }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            { echo "sha=${{ github.event.pull_request.head.sha }}"; echo "windows_run="; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=; windows_run=
          for row in $(gh run list --workflow windows.yml --branch main --event push --status success --limit 20 --json databaseId,headSha -q '.[] | "\(.databaseId),\(.headSha)"'); do
            if [ "$(gh run list --workflow ci.yml --commit "${row#*,}" --event push --status success --json databaseId -q length)" != 0 ]; then
              windows_run=${row%,*}; sha=${row#*,}; break
            fi
          done
          [ -n "$sha" ] || { echo "No recent commit on main passed both CI and the Windows build." >&2; exit 1; }
          current=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          skip=false
          if [ "$current" = "$sha" ] && [ "${{ github.event_name }}" = schedule ]; then skip=true; fi
          echo "main $sha (Windows run $windows_run); nightly now ${current:-none}; skip $skip"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  mac:
    needs: pick
    if: needs.pick.outputs.skip != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
      - name: Toolchain
        run: rustup toolchain install
      # Fails if EndeavorMCP's Helpers release has no build for the pinned
      # commit, rather than shipping an app that can't reach Linux servers.
      # That happens when Helpers never built that commit, or when its build
      # was pruned (scripts/prune-helpers.sh keeps the last 10 pins on main).
      - name: Linux servers' helpers
        run: |
          scripts/helpers.sh --fetch-only || {
            echo "::error::EndeavorMCP's Helpers release has no build for the commit Cargo.lock pins: Helpers never built it, or pruned it because this app commit is older than the last 10 pins on main. No nightly this time."
            exit 1
          }
      # A disk image whose window shows the splash scene (assets/dmg), the app
      # and a link to Applications. dmgbuild writes the window's layout itself,
      # so it doesn't need Finder, and copies the app with ditto, which keeps
      # bundle.sh's ad-hoc signature.
      - name: Bundle
        run: |
          scripts/bundle.sh
          python3 -m venv target/dmgbuild
          target/dmgbuild/bin/pip install -q dmgbuild==1.6.7
          mkdir -p dist
          target/dmgbuild/bin/dmgbuild -s assets/dmg/settings.py -D app=target/release/Endeavor.app Endeavor dist/Endeavor-macos-arm64.dmg
          hdiutil verify dist/Endeavor-macos-arm64.dmg
      - name: Check the disk image
        run: |
          set -eu
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/endeavor-dmg dist/Endeavor-macos-arm64.dmg
          ls -la /tmp/endeavor-dmg
          codesign --verify --strict /tmp/endeavor-dmg/Endeavor.app
          [ "$(readlink /tmp/endeavor-dmg/Applications)" = /Applications ]
          test -f /tmp/endeavor-dmg/.DS_Store
          hdiutil detach /tmp/endeavor-dmg
      # What a user sees on opening it, for review on pull requests. Hosted
      # runners have a desktop, but Finder there can be slow or refuse, so a
      # missing screenshot doesn't fail the build.
      - name: Screenshot of its window
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          open dist/Endeavor-macos-arm64.dmg
          sleep 15
          screencapture -x dist/dmg-window.png
          hdiutil detach /Volumes/Endeavor || true
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-mac
          path: dist/
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 1 }}

  publish:
    needs: [pick, mac]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.pick.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-mac
          path: dist
      - name: The Windows installer
        run: |
          set -eu
          gh run download "${{ needs.pick.outputs.windows_run }}" --pattern 'Endeavor-windows-x86_64-setup-*' --dir win
          setup=$(find win -name 'Endeavor-setup-*.exe' | head -1)
          [ -n "$setup" ] || { echo "The Windows run kept no installer." >&2; exit 1; }
          cp "$setup" dist/Endeavor-windows-x86_64-setup.exe
          rm -f dist/dmg-window.png
          ls -l dist
      - name: Publish
        run: |
          set -eu
          short=$(echo "$SHA" | cut -c1-7)
          cat > notes.md <<EOF
          The newest build of main that passed CI: build $short, $(date -u +%Y-%m-%d). It is replaced every day main changes. It is a test build: expect rough edges.

          - **Mac** (Apple Silicon, macOS 13 or later): open Endeavor-macos-arm64.dmg and drag Endeavor to Applications. It isn't signed by a known developer, so macOS blocks the first open: open it once, then go to System Settings, Privacy & Security, and click Open Anyway.
          - **Windows** (10 or 11, 64-bit): run Endeavor-windows-x86_64-setup.exe. It isn't signed, so Windows may say it protected your PC: click More info, then Run anyway. The Windows build can't connect to servers yet.
          - **Linux**: build it from source (docs/development.md).
          EOF
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title "Nightly build" --notes-file notes.md --target "$SHA"
          fi
          gh release upload nightly dist/* --clobber
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null
          gh release edit nightly --prerelease --title "Nightly build" --notes-file notes.md
