name: Windows Julia

on:
  pull_request:
    paths:
      - Cargo.lock
      - src/runtime.rs
      - rust-toolchain.toml
      - scripts/julia-smoke.py
      - .github/workflows/windows-julia.yml
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

concurrency:
  group: windows-julia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebook:
    name: Julia notebook (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --locked -p endeavor --bin endeavor
      - name: Run a notebook
        shell: bash
        env:
          ENDEAVOR_TEST_BROWSER: ${{ runner.temp }}/browser.txt
          PYTHONUNBUFFERED: '1'
        run: python scripts/julia-smoke.py target/debug/endeavor.exe --helper
      - name: Runtime log
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.log "$env:LOCALAPPDATA\Endeavor" -ErrorAction SilentlyContinue | ForEach-Object {
            "== $($_.FullName)"
            Get-Content -Tail 80 $_.FullName
          }
