# The app's first run on a Windows computer with no juliaup (issue #62): it
# installs juliaup for the account (the Microsoft Store with winget, else
# juliaup's App Installer file), adds the pinned Julia's channel and finds
# that channel's julia.exe (src/juliaup.rs). GitHub's Windows runners have no
# juliaup, so this runs that path for real, as the ignored test
# installs_juliaup_and_julia_where_there_is_none. The job summary says which
# runner has winget and how long each part took; the log says which route
# installed juliaup.
#
# Each image takes a different route. Windows Server 2025 has winget, and the
# Store install works there. Windows Server 2022 has no winget, so the app
# falls back to juliaup's App Installer file. That isn't a desktop whose Store
# is blocked: there winget is present and fails its own way.
#
# It downloads juliaup and about 300 MB of Julia, so it runs only when the
# install code, the pins (Cargo.lock: the process helper comes from
# EndeavorMCP), the toolchain or this file changes, once a week (the Store and juliaup's
# installer change without us), and by hand.
name: juliaup

on:
  push:
    branches: [main]
    paths:
      - src/juliaup.rs
      - src/runtime.rs
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/juliaup.yml
  pull_request:
    paths:
      - src/juliaup.rs
      - src/runtime.rs
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/juliaup.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: juliaup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  first-install:
    name: juliaup first install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build the test
        run: cargo test --locked -p endeavor --bin endeavor --no-run
      # What the runner has, for reading a failure. Windows PowerShell, since
      # PowerShell 7 can't load the Appx module here.
      - name: Runner
        shell: powershell
        run: |
          $os = (Get-CimInstance Win32_OperatingSystem).Caption
          $winget = if (Get-Command winget -ErrorAction SilentlyContinue) { 'has winget' } else { 'has no winget' }
          "$os, $winget"
          "**$os**, $winget." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Command juliaup -ErrorAction SilentlyContinue | Format-List Source
          Get-AppxPackage -Name *Julia* | Format-List Name, Version
      # Fails unless exactly that one test ran: a filter that matches nothing
      # passes with "0 passed".
      - name: Install juliaup and Julia
        shell: bash
        run: |
          cargo test --locked -p endeavor --bin endeavor -- --ignored --exact juliaup::tests::installs_juliaup_and_julia_where_there_is_none --nocapture 2>&1 | tee test.log
          grep -q 'test result: ok. 1 passed' test.log || { echo "::error::The juliaup install test didn't run"; exit 1; }
          # A retried App Installer install still passes, so say so where
          # it will be seen.
          if grep -q 'trying once more' test.log; then
            echo "::warning::The App Installer install failed once and worked on its second try: $(grep -m1 'trying once more' test.log)"
            echo "The App Installer install needed its second try." >> "$GITHUB_STEP_SUMMARY"
          fi
