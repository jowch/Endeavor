# Builds the workspace on Windows and runs the tests that can run there
# (docs/windows.md). Tests that need Unix (sh, signals, Unix sockets, tar, the
# #!/bin/sh stand-in Julia) are compiled out with cfg(unix); tests that wait
# on parts not yet ported to Windows (paths, home and app data folders,
# downloads) are ignored there with that reason. On main and on pull requests
# it also keeps a release build a tester can unzip and run, and its
# installer (docs/windows.md).
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      # Tests compare checked-in text byte for byte, so keep LF line endings.
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

  # A release build: debug builds compile their shaders at launch from the
  # crate's source folder, so they run only where they were built. The
  # artifact holds Endeavor\bin\endeavor.exe and Endeavor\Resources\, the
  # layout install::resources() looks for (the exe's folder's parent). Julia,
  # Node and the agents are installed on first run, as on macOS.
  # It also builds the installer (scripts/installer.iss) from that layout.
  # It ships no server helpers: it downloads the one a server needs from
  # EndeavorMCP's Helpers release when it first connects (src/remote.rs), by
  # the key of the EndeavorMCP commit Cargo.lock pins, which the build embeds.
  # ponytail: no signing (#12).
  helpers-key:
    name: server helpers' key
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      # Fails if the Helpers release has no build for the pinned commit,
      # rather than shipping an app that can't set up servers: Helpers never
      # built it, or pruned it (scripts/prune-helpers.sh).
      - id: key
        run: |
          set -eu
          key=$(scripts/helpers.sh --key)
          case "$key" in ''|*[!0-9a-f]*) echo "::error::scripts/helpers.sh --key printed '$key', not a key."; exit 1 ;; esac
          curl -fsSL "https://github.com/jowch/EndeavorMCP/releases/download/helpers/endeavor-$key.sha256" > sums || {
            echo "::error::EndeavorMCP's Helpers release has no build $key, for the commit Cargo.lock pins. Wait for its Helpers run, or pin a newer commit."
            exit 1
          }
          for platform in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64; do
            grep -q " endeavor-$key-$platform\$" sums || { echo "::error::Build $key on the Helpers release has no $platform helper."; exit 1; }
          done
          echo "key=$key" >> "$GITHUB_OUTPUT"

  package:
    name: windows-x86_64 build
    needs: helpers-key
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      # The C runtime linked in, so the exe doesn't need the Visual C++
      # Redistributable. WebView2's loader is linked in on MSVC already
      # (webview2-com-sys links WebView2LoaderStatic).
      # A build of main is the one the nightly publishes, and updates itself
      # (src/updater.rs); a pull request's doesn't.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          ENDEAVOR_CHANNEL: ${{ github.event_name == 'push' && 'nightly' || 'dev' }}
          ENDEAVOR_RELEASE_KEY: ${{ needs.helpers-key.outputs.key }}
        run: cargo build --locked --release -p endeavor --bin endeavor
      # Fails if the exe needs a DLL that a fresh Windows doesn't have.
      - name: Check the DLLs it needs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dlls = & $dumpbin.FullName /nologo /dependents target\release\endeavor.exe | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          $dlls
          if (-not ($dlls -match '^kernel32\.dll$')) { Write-Error "Couldn't read endeavor.exe's imports"; exit 1 }
          $extra = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib|ucrtbased|webview2loader)' }
          if ($extra) { Write-Error "endeavor.exe needs DLLs Windows doesn't ship: $extra"; exit 1 }
      - name: Lay out
        id: layout
        shell: bash
        run: |
          mkdir -p dist/Endeavor/bin dist/Endeavor/Resources
          cp target/release/endeavor.exe dist/Endeavor/bin/
          cp -R adapter adapter-codex dist/Endeavor/Resources/
          echo "build=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Endeavor-windows-x86_64-${{ steps.layout.outputs.build }}
          path: dist/
          retention-days: 30
      # Microsoft's Evergreen bootstrapper, which the installer runs only when
      # WebView2 is missing. It changes with each Edge release, so it isn't
      # pinned; its Microsoft signature is checked instead.
      - name: WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\installer | Out-Null
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile target\installer\MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature target\installer\MicrosoftEdgeWebview2Setup.exe
          $sig.SignerCertificate.Subject
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { Write-Error "The WebView2 bootstrapper isn't signed by Microsoft: $($sig.Status)"; exit 1 }
      # Inno Setup (scripts/installer.iss): a per-user installer, no admin.
      # The runner image has Inno Setup 6; the fallback pins a 6.x so a new
      # major version can't change the script's meaning.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.4.3 --no-progress -y; if ($LASTEXITCODE) { exit 1 } }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc /Qp "/DVersion=$version" "/DBuild=${{ steps.layout.outputs.build }}" "/DDist=$PWD\dist" "/DWebView2Setup=$PWD\target\installer\MicrosoftEdgeWebview2Setup.exe" "/O$PWD\target\installer" scripts\installer.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Endeavor-windows-x86_64-setup-${{ steps.layout.outputs.build }}
          path: target/installer/Endeavor-setup-*.exe
          retention-days: 30
