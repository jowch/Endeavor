# Temporary (PR #65): repeats juliaup's App Installer install on Server 2022
# to find why it sometimes fails. Removed before merge.
name: juliaup probe
on:
  push:
    branches: [claude/project-thread-w9vkoe]
    paths: [.github/workflows/juliaup-probe.yml]
jobs:
  appinstaller:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        attempt: [5, 6, 7, 8, 9, 10, 11, 12]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: The App Installer file
        shell: powershell
        run: (Invoke-WebRequest -UseBasicParsing https://install.julialang.org/Julia.appinstaller).Content
      - name: Install
        shell: powershell
        run: |
          $t = Get-Date
          try {
            Add-AppxPackage -AppInstallerFile 'https://install.julialang.org/Julia.appinstaller' -ErrorAction Stop
            "OK after $((Get-Date) - $t)"
          } catch {
            "FAILED after $((Get-Date) - $t)"
            ($_.Exception.Message -replace '\s+', ' ').Trim()
            if ($_.Exception.Message -match 'ActivityID ([0-9a-fA-F-]+)') { Get-AppPackageLog -ActivityID $Matches[1] | Format-List TimeCreated, Id, Message }
            exit 1
          }
          Get-AppxPackage -Name *Julia* | Format-List Name, Version
