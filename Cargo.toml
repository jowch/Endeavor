[package]
name = "endeavor"
default-run = "endeavor"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
# runtime_shaders: compile Metal shaders at launch so builds don't need full Xcode.
# font-kit: without it the macOS backend uses a no-op text system (no text renders).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["runtime_shaders", "font-kit"] }
gpui-wry = "=0.6.6"
wry = { package = "lb-wry", version = "0.53.3" }
raw-window-handle = "0.6"
gpui-component = "=0.6.6"
gpui-base = "=0.6.6"
agent-client-protocol = { version = "=2.2.0", features = ["unstable_session_fork", "unstable_session_notices"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# A logger for GPUI's warnings and errors (logs.rs). Already in the tree through GPUI.
log = "0.4"
# Checking downloads, without needing shasum (perl) or a Windows equivalent.
sha2 = "0.10"
# The runtime, the helper and the skills, pinned to a commit by Cargo.lock.
# To build against a local checkout, see docs/testing.md.
wire = { git = "https://github.com/jowch/EndeavorMCP" }
endeavor-mcp = { git = "https://github.com/jowch/EndeavorMCP" }

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions wry uses: the webview's light/dark appearance.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSView", "NSResponder"] }
# The web view snapshot's completion handler.
block2 = "0.6"
# "Claude is waiting for you" notifications.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationResponse", "UNNotification"] }

[target.'cfg(windows)'.dependencies]
# The local time zone's offset (Unix uses localtime_r). Already in the tree through GPUI.
chrono = "0.4"
# The page secret's random bytes (Unix reads /dev/urandom).
getrandom = "0.3"
# Process creation flags, the log file as stdout and stderr, and opening the sign-in page;
# the notebook web view's holes and keyboard focus.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# wry embeds the notebook webview as an X11 child window, so the app runs on X11 (or XWayland).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["x11"] }
# The same GTK wry's web view uses: started by the app, its events run from GPUI's loop (src/linux/gtk_loop.rs).
gtk = "0.18"
# GDK's Xlib display, for X input focus and the web view's shape (src/linux/).
gdkx11 = "0.18"
x11 = { version = "2.21", features = ["xlib"] }
# The same WebKitGTK wry's web view uses: its web process ending, and its find (src/linux/webcontent.rs).
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
