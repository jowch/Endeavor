[workspace]
members = ["crates/wire", "crates/endeavor-remote"]
# `cargo build` and `cargo test` also cover the helper binary (sent to macOS
# servers; This Mac runs the app itself as its helper).
default-members = [".", "crates/wire", "crates/endeavor-remote"]

[workspace.package]
version = "0.1.0"

[package]
name = "endeavor"
default-run = "endeavor"
version.workspace = true
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
# runtime_shaders: compile Metal shaders at launch so builds don't need full Xcode.
# font-kit: without it the macOS backend uses a no-op text system (no text renders).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["runtime_shaders", "font-kit"] }
gpui-wry = "=0.6.6"
wry = { package = "lb-wry", version = "0.53.3" }
raw-window-handle = "0.6"
gpui-component = "=0.6.6"
agent-client-protocol = { version = "=2.2.0", features = ["unstable_session_fork"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
wire = { path = "crates/wire" }
endeavor-remote = { path = "crates/endeavor-remote" }

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions wry uses: the webview's light/dark appearance.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSView", "NSResponder"] }
# The web view snapshot's completion handler.
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# wry embeds the notebook webview as an X11 child window, so the app runs on X11 (or XWayland).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["x11"] }
# The same GTK wry's web view uses: started and pumped by the app (src/platform.rs).
gtk = "0.18"
