[package]
name = "endeavor"
default-run = "endeavor"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["runtime_shaders", "font-kit"] }
gpui-wry = { path = "vendor/gpui-wry" }
wry = { package = "lb-wry", version = "0.53.3" }
url = "2.5"
raw-window-handle = "0.6"
gpui-component = "=0.11.0"
gpui-base = "=0.11.0"
agent-client-protocol = { version = "=2.2.0", features = ["unstable_session_fork", "unstable_session_notices"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
sha2 = "0.10"
wire = { git = "https://github.com/jowch/EndeavorMCP" }
endeavor-mcp = { git = "https://github.com/jowch/EndeavorMCP" }
mermaid = { package = "bezel-mermaid", version = "=0.2.22" }
markdown = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSView", "NSResponder"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationResponse", "UNNotification"] }

[target.'cfg(windows)'.dependencies]
chrono = "0.4"
getrandom = "0.3"
webview2-com = "0.38"
windows-core = "0.61"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["x11"] }
gtk = "0.18"
gdkx11 = "0.18"
x11 = { version = "2.21", features = ["xlib"] }
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
png = "0.18"
